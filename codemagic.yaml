
workflows:
  android-workflow:
    name: English Books APK
    max_build_duration: 60
    instance_type: linux

    environment:
      flutter: stable

    scripts:
      - name: Generate Android project
        script: |
          flutter create --platforms=android --org com.englishbooks .

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
