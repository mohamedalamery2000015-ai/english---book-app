
workflows:
  android-workflow:
    name: English Books APK
    max_build_duration: 60
    instance_type: linux

    environment:
      flutter: stable

    scripts:
      - name: Generate Android files
        script: flutter create --platforms=android --org com.example .

      - name: Get dependencies
        script: flutter pub get

      - name: Build APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
